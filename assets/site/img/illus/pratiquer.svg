<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Illustration : une tablette graphique avec une courbe dessinée au stylet, un brief et une liste de tâches cochées"><style>
.fl{animation:f 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:f 7s ease-in-out -2s infinite;transform-box:fill-box;transform-origin:center}
.fl3{animation:f 8s ease-in-out -4s infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dr{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 4s ease-in-out infinite alternate}
@keyframes f{50%{transform:translateY(-9px)}}
@keyframes tw{50%{transform:scale(.6);opacity:.5}}
@keyframes dr{to{stroke-dashoffset:0}}
text{font-family:Montserrat,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.dr{stroke-dashoffset:0}}
</style>
<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0E1A3C" flood-opacity=".16"/></filter></defs><rect x="30" y="40" width="420" height="320" rx="160" fill="#F7F4EE"/>
<!-- tablette -->
<g filter="url(#sh)"><rect x="96" y="96" width="270" height="196" rx="18" fill="#0E1A3C"/><rect x="110" y="110" width="242" height="168" rx="8" fill="#FFFFFF"/></g>
<path class="dr" d="M134 244 C164 150 214 150 232 204 S300 252 326 140" stroke="#F39822" stroke-width="6" fill="none" stroke-linecap="round"/>
<rect x="128" y="238" width="12" height="12" fill="#FFFFFF" stroke="#3563AD" stroke-width="2.5"/><rect x="226" y="198" width="12" height="12" fill="#FFFFFF" stroke="#3563AD" stroke-width="2.5"/><rect x="320" y="134" width="12" height="12" fill="#FFFFFF" stroke="#3563AD" stroke-width="2.5"/>
<line x1="232" y1="204" x2="270" y2="236" stroke="#3563AD" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="270" cy="236" r="4" fill="#3563AD"/>
<!-- stylet -->
<g class="fl" transform="rotate(32 350 120)"><rect x="342" y="40" width="16" height="96" rx="7" fill="#F39822"/><path d="M342 136 L350 156 L358 136Z" fill="#0E1A3C"/><rect x="342" y="56" width="16" height="6" fill="#0E1A3C" opacity=".25"/></g>
<!-- post-it -->
<g class="fl2" filter="url(#sh)" transform="rotate(-7 70 120)"><rect x="40" y="84" width="92" height="74" rx="6" fill="#FDC967"/><text x="54" y="112" font-size="13" font-weight="800" fill="#0E1A3C">Brief</text><rect x="54" y="122" width="58" height="5" rx="2" fill="#0E1A3C" opacity=".35"/><rect x="54" y="134" width="44" height="5" rx="2" fill="#0E1A3C" opacity=".35"/></g>
<!-- checklist -->
<g class="fl3" filter="url(#sh)"><rect x="300" y="244" width="150" height="112" rx="14" fill="#FFFFFF"/>
<circle cx="322" cy="270" r="9" fill="#1D8A52"/><path d="M317 270 l3.5 3.5 l6.5 -7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="275" font-size="12" font-weight="700" fill="#0E1A3C">Apprendre</text>
<circle cx="322" cy="298" r="9" fill="#1D8A52"/><path d="M317 298 l3.5 3.5 l6.5 -7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="340" y="303" font-size="12" font-weight="700" fill="#0E1A3C">Pratiquer</text>
<circle cx="322" cy="326" r="9" fill="none" stroke="#F39822" stroke-width="2.5"/><text x="340" y="331" font-size="12" font-weight="700" fill="#0E1A3C">Produire</text></g>
<!-- palette -->
<g class="fl2"><circle cx="96" cy="316" r="13" fill="#F39822"/><circle cx="126" cy="324" r="13" fill="#3563AD"/><circle cx="156" cy="316" r="13" fill="#FDC967"/><circle cx="186" cy="324" r="13" fill="#0E1A3C"/></g>
<path class="tw" d="M420 83 Q421.5 88.5 427 90 Q421.5 91.5 420 97 Q418.5 91.5 413 90 Q418.5 88.5 420 83Z" fill="#FDC967"/><path class="tw" d="M60 214 Q61.5 218.5 66 220 Q61.5 221.5 60 226 Q58.5 221.5 54 220 Q58.5 218.5 60 214Z" fill="#F39822"/></svg>